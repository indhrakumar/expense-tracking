<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xpense. — Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <!-- HEADER -->
      <div class="header">
        <div class="logo">X<span>pense</span></div>
        <button class="theme-btn" onclick="toggleTheme()">☀ Light</button>
      </div>

      <!-- BALANCE CARD -->
      <div class="balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="totalBal">₹0</div>
        <div class="balance-sub">
          <div class="b-item">
            <div class="b-item-label">↑ Income</div>
            <div class="b-item-val" id="totalInc">₹0</div>
          </div>
          <div class="b-item">
            <div class="b-item-label">↓ Expenses</div>
            <div class="b-item-val" id="totalExp">₹0</div>
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="stat">
          <div class="stat-label">Transactions</div>
          <div class="stat-val" id="txCount">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">This Month</div>
          <div class="stat-val" id="monthExp">₹0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Avg Expense</div>
          <div class="stat-val red" id="avgExp">₹0</div>
        </div>
        <div class="stat">
          <div class="stat-label">Top Category</div>
          <div class="stat-val" id="topCat" style="font-size: 0.95rem">—</div>
        </div>
      </div>

      <!-- ADD TRANSACTION FORM -->
      <div class="form-card">
        <div class="form-title">
          <i class="ti ti-plus" aria-hidden="true"></i> Add Transaction
        </div>
        <div class="type-toggle">
          <button
            class="type-btn active income"
            id="btn-income"
            onclick="setType('income')">
            ↑ Income
          </button>
          <button
            class="type-btn expense"
            id="btn-expense"
            onclick="setType('expense')">
            ↓ Expense
          </button>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Description</label>
            <input id="desc" placeholder="e.g. Grocery, Salary..." />
          </div>
          <div class="form-group">
            <label>Amount (₹)</label>
            <input id="amount" type="number" placeholder="0.00" min="0" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="category">
              <option value="Food">🍔 Food</option>
              <option value="Transport">🚗 Transport</option>
              <option value="Shopping">🛍 Shopping</option>
              <option value="Health">💊 Health</option>
              <option value="Entertainment">🎬 Entertainment</option>
              <option value="Utilities">💡 Utilities</option>
              <option value="Education">📚 Education</option>
              <option value="Salary">💼 Salary</option>
              <option value="Business">📈 Business</option>
              <option value="Other">🔖 Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input id="txdate" type="date" />
          </div>
        </div>
        <button class="add-btn" onclick="addTx()">Add Transaction</button>
      </div>

      <!-- CATEGORY BREAKDOWN -->
      <div class="cat-card">
        <div class="section-title">Category Breakdown</div>
        <div id="catBars"><div class="empty">No expenses yet</div></div>
      </div>

      <!-- TRANSACTION LIST -->
      <div class="tx-card">
        <div class="section-title">Transaction History</div>
        <div class="tx-controls">
          <input id="search" placeholder="Search..." oninput="render()" />
          <select id="filterType" onchange="render()">
            <option value="">All Types</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filterCat" onchange="render()">
            <option value="">All Categories</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Shopping</option>
            <option>Health</option>
            <option>Entertainment</option>
            <option>Utilities</option>
            <option>Education</option>
            <option>Salary</option>
            <option>Business</option>
            <option>Other</option>
          </select>
        </div>
        <div id="txList"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
